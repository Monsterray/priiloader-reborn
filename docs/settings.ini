; Priiloader settings: a reference, for people. Nothing reads this file.
;
; The settings live in /title/00000001/00000002/data/loader.ini on the Wii's NAND. The name is misleading:
; it is not text but the Settings struct of src/priiloader/include/settings.h, as it is in memory, written
; as a binary file. This file lists its fields: one [FieldName] section per field, in file order, with
; the offset in bytes, the size in bytes, what it does, the values it can have and its default.
; tests/host/priiloader/test_settings.cpp checks the offsets and sizes here against the struct, and that
; every field of the struct has a section.
;
; How the file grows (LoadSettings, src/priiloader/source/settings.cpp)
;  - The file is SETTINGS_FILE_SIZE bytes: the end of the last field (34 today). The struct is longer in
;    memory (64 bytes: it is aligned to 32), the rest is never written.
;  - A new field goes at the end and makes the file longer. A file of an older size we know is read, the
;    new fields get their defaults, and the file is written back at the new size.
;  - The first layout was 32 bytes: fields up to PreferredMountPoint (28 bytes) and 4 bytes of padding.
;    The padding is kept as LegacyPadding so that the next field starts behind the end of that file.
;    That is how a 32 byte file is told from a 34 byte one.
;  - A file of any other size is deleted and made again with the defaults.
;  - When version or RCVersion differ from the running Priiloader's, they are updated and the file
;    is written back.
;  - Going back to an older Priiloader (upstream, or this fork before the 34 byte layout) resets every
;    setting to its default, password checks included: those versions accept only a 32 byte file.
;
; Keys in a section: offset, size (bytes), meaning, values (enum names of settings.h), default, menu
; (the row of Priiloader's settings menu, if it has one).

[autoboot]
offset = 0
size = 1
meaning = what Priiloader does at power on or after a reset
values = AUTOBOOT_DISABLED, AUTOBOOT_HBC, AUTOBOOT_BOOTMII_IOS, AUTOBOOT_SYS, AUTOBOOT_FILE
default = AUTOBOOT_SYS
menu = Autoboot

[version]
offset = 4
size = 4
meaning = VERSION_MERGED of the Priiloader that wrote the file
values = any
default = VERSION_MERGED
menu = none

[ReturnTo]
offset = 8
size = 1
meaning = what to do when a title returns to the System Menu
values = RETURNTO_SYSMENU, RETURNTO_PRIILOADER, RETURNTO_AUTOBOOT, RETURNTO_FILE
default = RETURNTO_SYSMENU
menu = Return to

[ShutdownTo]
offset = 9
size = 1
meaning = what to do when the Wii is shut down
values = SHUTDOWNTO_NONE, SHUTDOWNTO_PRIILOADER, SHUTDOWNTO_AUTOBOOT
default = SHUTDOWNTO_NONE
menu = Shutdown to

[StopDisc]
offset = 10
size = 1
meaning = stop the disc drive at startup
values = 0 off, 1 on
default = 0
menu = Stop disc on startup

[LidSlotOnError]
offset = 11
size = 1
meaning = light the disc slot when an error is shown
values = 0 off, 1 on
default = 0
menu = Light slot on error

[IgnoreShutDownMode]
offset = 12
size = 1
meaning = always shut down to standby, whatever the System Menu's shutdown mode is
values = 0 off, 1 on
default = 0
menu = Ignore standby

[RCVersion]
offset = 16
size = 4
meaning = VERSION_RC of the Priiloader that wrote the file
values = any
default = VERSION_RC
menu = none

[SystemMenuIOS]
offset = 20
size = 1
meaning = the IOS to start the System Menu with, when UseSystemMenuIOS is off
values = an IOS number from 3 to 254
default = 0 (the menu then picks one when UseSystemMenuIOS is switched off)
menu = IOS to use for SM

[UseSystemMenuIOS]
offset = 21
size = 1
meaning = start the System Menu with the IOS it asks for, not SystemMenuIOS
values = 0 off, 1 on
default = 1
menu = Use System Menu IOS

[BlackBackground]
offset = 22
size = 1
meaning = the menu's background colour
values = 0 white, 1 black
default = 1
menu = Background Color

[DumpGeckoText]
offset = 23
size = 1
meaning = write the debug output to a file on the SD card or USB drive, as well as to USB Gecko
values = 0 off, 1 on
default = 0
menu = Dump Gecko output

[PasscheckPriiloader]
offset = 24
size = 1
meaning = ask for the password before the Priiloader menu
values = 0 off, 1 on
default = 0
menu = Protect Priiloader

[PasscheckMenu]
offset = 25
size = 1
meaning = ask for the password before an autoboot
values = 0 off, 1 on
default = 0
menu = Protect Autoboot

[ShowRCUpdates]
offset = 26
size = 1
meaning = the updater also offers release candidates
values = 0 off, 1 on
default = 0
menu = Show RC Updates

[PreferredMountPoint]
offset = 27
size = 1
meaning = the drive that is looked at first for files (main.nfo, hacks, DOLs)
values = MOUNT_AUTO, MOUNT_SD, MOUNT_USB
default = MOUNT_AUTO
menu = Default fat device

[LegacyPadding]
offset = 28
size = 4
meaning = the padding of the first, 32 byte layout. never a setting; always 0
values = 0
default = 0
menu = none

[AutobootWait]
offset = 32
size = 1
meaning = how long autoboot looks for a key (B held, a USB keyboard) before it decides to boot. a shorter time boots sooner, but a keyboard or a Wii Remote that connects late is missed.
; with 0 ms Priiloader scans once, about 1 ms after the input stack starts, which is too soon to see a
; controller : holding B then does nothing, and only the reset button stops autoboot
values = AUTOBOOTWAIT_0MS, AUTOBOOTWAIT_100MS, AUTOBOOTWAIT_250MS, AUTOBOOTWAIT_500MS
default = AUTOBOOTWAIT_500MS
menu = Autoboot key wait

[UpdateSource]
offset = 33
size = 1
meaning = where the updater looks for new versions
values = UPDATESOURCE_DACOTACO (upstream's server, plain HTTP), UPDATESOURCE_GITHUB (the releases of priiloader-reborn)
default = UPDATESOURCE_GITHUB
menu = Update from
